[workspace]
authors = ["Per Unneberg <per.unneberg@scilifelab.se>"]
channels = ["conda-forge", "bioconda"]
name = "pgip-data"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
graphviz = ">=13.1.2,<14"

[feature.variantcalling.dependencies]
bcftools = ">=1.22,<2"
bedtools = ">=2.31.1,<3"
bwa = ">=0.7.19,<0.8"
csvtk = ">=0.34.0,<0.35"
gatk4 = ">=4.6.2.0,<5"
picard = ">=3.4.0,<4"
python = ">=3.13.5,<3.14"
samtools = ">=1.22.1,<2"
seqtk = ">=1.5,<2"
vcftools = ">=0.1.17,<0.2"
fastqc = ">=0.12.1,<0.13"
qualimap = ">=2.3,<3"
vcflib = ">=1.0.14,<2"
multiqc = ">=1.30,<2"
r-gplots = ">=3.2.0,<4"
r-ggplot2 = ">=3.5.2,<4"
r-gsalib = ">=2.2.1,<3"

[feature.lint.dependencies]
pre-commit = ">=4.2.0,<5"
pre-commit-hooks = ">=5.0.0,<6"
shellcheck = ">=0.10.0,<0.11"
ruff = ">=0.11.11,<0.12"
typos = ">=1.32.0,<2"
actionlint = ">=1.7.7,<2"
go-shfmt = ">=3.11.0,<4"
prettier = ">=3.5.3,<4"
taplo = ">=0.9.3,<0.10"

[feature.lint.tasks]
actionlint = { cmd = "actionlint", env = { SHELLCHECK_OPTS = "-e SC2086" } }
lint = { cmd = "pre-commit run --all-files --hook-stage=manual", description = "Run all linters and formatters on all code" }
pre-commit-install = "pre-commit install --install-hooks -t=pre-commit -t=pre-push"
pre-commit-install-minimal = "pre-commit install -t=pre-commit"
pre-commit-run = "pre-commit run --all-files"
prettier-fmt = { cmd = "prettier --write" }
ruff-format = "ruff format --force-exclude"
ruff-lint = "ruff check --fix --exit-non-zero-on-fix --force-exclude"
shell-format = "shfmt --write --indent=4 --simplify --binary-next-line"
toml-format = { cmd = "taplo fmt", env = { RUST_LOG = "warn" } }
toml-lint = "taplo lint --verbose **/pixi.toml"
typecheck-python = "mypy"
typos = "typos --write-changes --force-exclude"

[feature.snakemake.dependencies]
snakemake = ">=9.9.0,<10"
snakemake-storage-plugin-http = ">=0.3.0,<0.4"

[feature.sra.dependencies]
sra-tools = ">=3.2.1,<4"
entrez-direct = ">=24.0,<25"
ca-certificates = ">=2025.8.3,<2026"

[feature.repeatmasker.dependencies]
repeatmasker = ">4.1.5"
repeatmodeler = ">=2.0.7,<3"

[environments]
lint = { features = ["lint", "snakemake"], solve-group = "prod" }
monkeyflower = { features = [
  "variantcalling",
  "snakemake",
  "sra",
], solve-group = "default" }
repeatmodeler = { features = [
  "repeatmasker",
  "snakemake",
], solve-group = "prod" }
